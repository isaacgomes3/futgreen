<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/public/brand/favicon.svg" type="image/svg+xml" />
  <title>Admin Jogos · ARBISHIELD</title>
  <link rel="stylesheet" href="/public/css/futgreen.css?v=stack1" />
</head>
<body>
  <div class="fg-shell" id="fg-shell-root">
    <main class="fg-main">
      <section class="fg-section">
        <h2>Lançar jogos protegidos</h2>
        <div id="radar"></div>
        <form id="manual" class="fg-form fg-match" style="max-width:520px;margin-bottom:2rem">
          <h3 style="margin:0;font-family:var(--font-display);font-style:italic;text-transform:uppercase">Evento manual</h3>
          <label>Casa <input name="home_team" id="home_team" autocomplete="off" required /></label>
          <input type="hidden" name="home_logo" id="home_logo" />
          <label>Visitante <input name="away_team" id="away_team" autocomplete="off" required /></label>
          <input type="hidden" name="away_logo" id="away_logo" />
          <label>Liga <input name="league" value="Brasileirão" /></label>
          <label>Kickoff <input name="starts_at" type="datetime-local" required /></label>
          <button class="fg-btn" type="submit">Criar rascunho</button>
        </form>
        <div id="list"></div>
      </section>
    </main>
  </div>
  <script type="module">
    import { mountShell } from '/public/js/v2-shell.js';
    import { api, toast, fmtWhen } from '/public/js/api.js';
    import { mountBetbraRadar, bindTeamSearch } from '/public/js/admin-radar.js?v=stack1';
    await mountShell({ admin: true });

    bindTeamSearch(document.getElementById('home_team'), {
      onPick: (t) => {
        document.getElementById('home_logo').value = t.logo || '';
      },
    });
    bindTeamSearch(document.getElementById('away_team'), {
      onPick: (t) => {
        document.getElementById('away_logo').value = t.logo || '';
      },
    });

    async function loadMatches() {
      const { matches } = await api('/api/futgreen/matches?all=1');
      const el = document.getElementById('list');
      el.innerHTML = matches
        .map(
          (m) => `
        <article class="mdz-card" data-id="${m.id}">
          <div class="mdz-card-top">
            <span>${m.is_published ? 'Publicado' : 'Rascunho'}${m.settled_at ? ' · Finalizado' : ''} · ${m.source || 'manual'}</span>
            <span>${fmtWhen(m.starts_at)}</span>
          </div>
          <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:0.5rem;align-items:center;margin:0.4rem 0">
            <div style="display:flex;align-items:center;gap:0.4rem">
              ${m.home_logo ? `<img src="${m.home_logo}" width="28" height="28" style="border-radius:50%" alt="" />` : ''}
              <strong>${m.home_team}</strong>
            </div>
            <span class="fg-vs">×</span>
            <div style="display:flex;align-items:center;gap:0.4rem;justify-content:flex-end">
              <strong>${m.away_team}</strong>
              ${m.away_logo ? `<img src="${m.away_logo}" width="28" height="28" style="border-radius:50%" alt="" />` : ''}
            </div>
          </div>
          <div class="fg-meta">${m.label || (m.market_name ? `${m.market_name}${m.selection_name ? ` · ${m.selection_name}` : ''}${m.side ? ` · ${m.side}` : ''}${m.odd ? ` @ ${m.odd}` : ''}` : '')}${m.label || m.market_name ? ' · ' : ''}${m.league || ''} ${m.home_score != null ? `· ${m.home_score}-${m.away_score}` : ''}</div>
          <div class="mdz-card-foot">
            ${!m.is_published && !m.settled_at ? `<button class="fg-btn" data-act="publish">Publicar na fila</button>` : ''}
            ${
              m.is_published && !m.settled_at
                ? `
              <input class="hs" type="number" min="0" placeholder="Casa" value="${m.home_score != null ? m.home_score : ''}" style="width:4rem;padding:.4rem;border-radius:8px;border:1px solid var(--fg-line-soft);background:var(--fg-void);color:inherit" />
              <input class="as" type="number" min="0" placeholder="Fora" value="${m.away_score != null ? m.away_score : ''}" style="width:4rem;padding:.4rem;border-radius:8px;border:1px solid var(--fg-line-soft);background:var(--fg-void);color:inherit" />
              <input class="mn" type="number" min="0" max="120" placeholder="Min" value="${m.minute != null ? m.minute : ''}" title="Minuto" style="width:3.5rem;padding:.4rem;border-radius:8px;border:1px solid var(--fg-line-soft);background:var(--fg-void);color:inherit" />
              <button class="fg-btn ghost" data-act="live">Placar ao vivo</button>
              <button class="fg-btn ghost" data-act="ft">Marcar encerrado</button>
              <button class="fg-btn" data-act="reembolso">REEMBOLSO</button>
              <button class="fg-btn warn" data-act="ganho">GANHO</button>
              <button class="fg-btn ghost" data-act="anula">ANULA</button>
              <button class="fg-btn danger" data-act="cancel-event">Cancelar evento</button>
            `
                : ''
            }
            ${m.suspended ? `<span class="fg-status" style="color:#ffb020">Evento suspenso — em andamento</span>` : ''}
            ${
              m.exchange_url
                ? `<a class="fg-btn ghost fg-betbra-btn" href="${m.exchange_url}" target="_blank" rel="noopener" title="Abrir na BetBra"><svg class="fg-betbra-mark" viewBox="0 0 64 64" width="22" height="22" aria-hidden="true"><g transform="translate(32 32) skewX(-10) translate(-32 -32)"><path fill="#00A651" d="M13 7h21c9.5 0 16 5.4 16 13.6 0 5-2.6 9-7 10.9 5.4 1.6 9 6.2 9 12.4C52 55.2 44.6 61 33.8 61H13V7z"/><path fill="#0a0e0c" d="M25 17h9.2c4.2 0 6.6 2 6.6 5.4s-2.4 5.4-6.6 5.4H25V17z"/><path fill="#0a0e0c" d="M25 37h10.4c4.8 0 7.6 2.6 7.6 6.8S40.2 51 35.4 51H25V37z"/><rect x="9" y="6" width="13" height="52" rx="1.5" fill="#FFCC29"/><circle cx="35" cy="38" r="17" fill="#FFCC29"/><circle cx="35" cy="38" r="7.5" fill="#3E5FBF"/></g></svg><span>Abrir BetBra</span></a>`
                : ''
            }
          </div>
        </article>`,
        )
        .join('') || '<p class="fg-empty">Nenhum jogo.</p>';

      el.querySelectorAll('[data-act]').forEach((btn) => {
        btn.onclick = async () => {
          const card = btn.closest('.mdz-card');
          const id = card.dataset.id;
          const act = btn.dataset.act;
          try {
            if (act === 'publish') {
              await api('/api/futgreen/matches/publish', { method: 'POST', body: { match_id: id }, admin: true });
              toast('Publicado na fila');
            } else if (act === 'cancel-event') {
              if (!confirm('Cancelar este evento? Proteções ativas serão estornadas (sem P&L).')) return;
              await api('/api/futgreen/match-cancel', { method: 'POST', admin: true, body: { match_id: id } });
              toast('Evento cancelado — proteções ativas estornadas');
            } else if (act === 'live' || act === 'ft') {
              const minuteRaw = card.querySelector('.mn')?.value;
              await api('/api/futgreen/match-live-sync', {
                method: 'POST',
                admin: true,
                body: {
                  match_id: id,
                  home_score: Number(card.querySelector('.hs')?.value || 0),
                  away_score: Number(card.querySelector('.as')?.value || 0),
                  minute: minuteRaw === '' || minuteRaw == null ? null : Number(minuteRaw),
                  finished: act === 'ft',
                },
              });
              toast(act === 'ft' ? 'Partida marcada como encerrada' : 'Placar ao vivo atualizado');
            } else {
              await api('/api/futgreen/match-settle', {
                method: 'POST',
                admin: true,
                body: {
                  match_id: id,
                  outcome: act,
                  home_score: Number(card.querySelector('.hs')?.value || 0),
                  away_score: Number(card.querySelector('.as')?.value || 0),
                },
              });
              toast(`Liquidado: ${act}`);
            }
            await loadMatches();
          } catch (e) {
            toast(e.message);
          }
        };
      });
    }

    document.getElementById('manual').onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const starts = new Date(fd.get('starts_at')).toISOString();
      try {
        await api('/api/futgreen/matches', {
          method: 'POST',
          admin: true,
          body: {
            home_team: fd.get('home_team'),
            away_team: fd.get('away_team'),
            home_logo: fd.get('home_logo') || null,
            away_logo: fd.get('away_logo') || null,
            league: fd.get('league'),
            starts_at: starts,
            source: 'manual',
          },
        });
        toast('Rascunho criado');
        e.target.reset();
        await loadMatches();
      } catch (err) {
        toast(err.message);
      }
    };

    const dt = document.querySelector('[name=starts_at]');
    const d = new Date(Date.now() + 2 * 3600e3);
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    dt.value = d.toISOString().slice(0, 16);

    await mountBetbraRadar(document.getElementById('radar'), {
      dest: 'proteger',
      onImported: () => loadMatches(),
    });
    await loadMatches();
  </script>
</body>
</html>
