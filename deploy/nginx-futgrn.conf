# FUTGRN — proxy Nginx (porta app 3101)
# Domínio canônico: https://arbishield.app

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name arbishield.app www.arbishield.app;
    add_header Cache-Control "no-store" always;
    return 308 https://arbishield.app$request_uri;
}

# www HTTPS → apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.arbishield.app;

    ssl_certificate /etc/letsencrypt/live/arbishield.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arbishield.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://arbishield.app$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name arbishield.app;

    ssl_certificate /etc/letsencrypt/live/arbishield.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arbishield.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "upgrade-insecure-requests" always;

    client_max_body_size 10M;

    # Páginas HTML: limpa cache HTTP antigo que mantém “Não seguro”
    location ~* \.html$ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "upgrade-insecure-requests" always;
        add_header Clear-Site-Data "\"cache\"" always;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
