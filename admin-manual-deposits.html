<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/public/brand/favicon.svg" type="image/svg+xml" />
  <title>Depósitos manuais · FUTGRN</title>
  <link rel="stylesheet" href="/public/css/futgreen.css" />
</head>
<body>
  <div class="fg-shell" id="fg-shell-root">
    <main class="fg-main">
      <section class="fg-section">
        <h2>Lançar saldo</h2>
        <div id="list"></div>
      </section>
    </main>
  </div>
  <script type="module">
    import { mountShell } from '/public/js/v2-shell.js';
    import { api, toast, brl, fmtWhen } from '/public/js/api.js';

    if (!localStorage.getItem('fg_email')?.match(/admin|isaac|carlos/)) {
      localStorage.setItem('fg_email', 'admin@futgreen.local');
    }
    await mountShell({ admin: true });

    // list via raw: we'll add a tiny endpoint usage — deposits are in store; expose through approve list by reading pending from a new GET
    // Quick path: seed creates none; clients POST deposit-proof. Add GET in page via users+hack:
    // For MVP, call approve only when id known — fetch from transactions won't work.
    // Extend: use /api/futgreen/transactions won't list deposits. Add inline fetch to a simple dump.

    const res = await fetch('/api/futgreen/manual-deposits', {
      headers: { 'X-Admin-Email': localStorage.getItem('fg_email'), 'X-User-Email': localStorage.getItem('fg_email') },
    });
    let deposits = [];
    if (res.ok) {
      const data = await res.json();
      deposits = data.deposits || [];
    } else {
      // fallback message
      document.getElementById('list').innerHTML =
        '<p class="fg-empty">Nenhum depósito pendente.</p>';
    }

    // Patch server to support GET — for now render if we got data; else try seed note
    function render(rows) {
      const el = document.getElementById('list');
      const pending = rows.filter((d) => d.status === 'pending');
      if (!pending.length) {
        el.innerHTML = '<p class="fg-empty">Nenhum depósito pendente.</p>';
        return;
      }
      el.innerHTML = pending
        .map(
          (d) => `
        <article class="mdz-card" data-id="${d.id}">
          <div class="mdz-card-top"><span>${d.user_id}</span><span>${fmtWhen(d.created_at)}</span></div>
          <div class="mdz-card-game">${brl(d.amount_cents)} → ${d.dest}</div>
          <div class="mdz-card-foot">
            <button class="fg-btn" data-act="credit">Confirmar e Creditar</button>
            <button class="fg-btn ghost" data-act="mark">Já creditado</button>
          </div>
        </article>`,
        )
        .join('');

      el.querySelectorAll('[data-act]').forEach((btn) => {
        btn.onclick = async () => {
          try {
            await api('/api/futgreen/approveManualDeposit', {
              method: 'POST',
              admin: true,
              body: {
                deposit_id: btn.closest('[data-id]').dataset.id,
                mark_only: btn.dataset.act === 'mark',
              },
            });
            toast(btn.dataset.act === 'mark' ? 'Marcado' : 'Creditado');
            location.reload();
          } catch (e) {
            toast(e.message);
          }
        };
      });
    }

    if (res.ok) render(deposits);
  </script>
</body>
</html>
