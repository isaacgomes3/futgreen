<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/public/brand/favicon.svg" type="image/svg+xml" />
  <title>Desafio · FUTGRN</title>
  <link rel="stylesheet" href="/public/css/futgreen.css" />
</head>
<body>
  <div class="fg-shell" id="fg-shell-root">
    <main class="fg-main">
      <section class="fg-section">
        <h2>Desafio</h2>
        <p class="lead">Suas entradas e os desafios disponíveis na grade.</p>
        <div id="lock" class="fg-empty" hidden></div>
      </section>

      <section class="fg-section">
        <h3 class="fg-ind-list-head" style="margin-bottom:0.75rem">Meus desafios</h3>
        <div id="journey"></div>
      </section>

      <section class="fg-section">
        <h3 class="fg-ind-list-head" style="margin-bottom:0.75rem">Grade disponível</h3>
        <div id="grade" class="fg-grid"></div>
      </section>
    </main>
  </div>
  <script type="module">
    import { mountShell } from '/public/js/v2-shell.js';
    import { api, brl, toast, fmtWhen } from '/public/js/api.js';
    import { previewSinal } from '/public/js/desafio-ciclo-math.js';
    import { teamBlock, teamPairCell } from '/public/js/teams-ui.js';

    await mountShell();
    const lock = document.getElementById('lock');
    const grade = document.getElementById('grade');
    const journey = document.getElementById('journey');

    async function loadJourney() {
      const { participations } = await api('/api/futgreen/desafio-jornada', { method: 'POST', body: {} });
      journey.innerHTML = !participations.length
        ? '<p class="fg-empty">Nenhuma entrada ainda. Escolha um jogo na grade abaixo.</p>'
        : `<div class="fg-grid">
            ${participations
              .map((p) => {
                const s = p.step;
                const game = s
                  ? teamPairCell(s.home_team, s.away_team, s.home_logo, s.away_logo)
                  : `<span>${p.step_id}</span>`;
                return `
                <article class="fg-match">
                  ${game}
                  <div class="fg-meta" style="margin-top:0.65rem">${fmtWhen(p.created_at)} · odd ${p.odd}</div>
                  <div class="fg-meta">Stake ${brl(p.stake_cents)}</div>
                  <span class="fg-status ${p.result || p.status}">${p.result || p.status}</span>
                </article>`;
              })
              .join('')}
          </div>`;
    }

    async function loadGrade() {
      const data = await api('/api/futgreen/desafios');
      if (!data.unlocked) {
        lock.hidden = false;
        lock.innerHTML = `Carteira Jornada vazia. <a href="/app-carteira.html">Ir à Carteira</a>`;
      } else {
        lock.hidden = true;
      }

      if (!data.desafios?.length) {
        grade.innerHTML = data.unlocked
          ? '<p class="fg-empty">Nenhum desafio publicado no momento.</p>'
          : '';
        return;
      }

      grade.innerHTML = data.desafios
        .flatMap(({ desafio, steps }) =>
          steps
            .filter((s) => s.status !== 'done')
            .map((step) => {
              const stakeDefault = 50;
              const prev = previewSinal(step, stakeDefault);
              const teamLabel =
                step.bet_team_side === 'away' ? step.away_team : step.home_team;
              return `
              <article class="fg-match" data-desafio="${desafio.id}" data-step="${step.id}">
                <div class="fg-meta">${desafio.title} · etapa ${step.step_index} · ${fmtWhen(step.starts_at)}</div>
                <div class="fg-match-teams">
                  ${teamBlock(step.home_team, step.home_logo)}
                  <div class="fg-vs">×</div>
                  ${teamBlock(step.away_team, step.away_logo)}
                </div>
                <div class="fg-meta">Zebra no time: <strong>${teamLabel}</strong> · mercado ${step.market_flag || 'dnb'}</div>
                <div class="fg-desafio-panels">
                  <div class="fg-panel">
                    <h4>FUTGRN</h4>
                    <div class="odd">${Number(step.odd_futgreen).toFixed(2)}</div>
                    <div class="fg-meta">Liq. ${brl((step.liquidity || 0) * 100)}</div>
                  </div>
                  <div class="fg-panel casa">
                    <h4>${step.casa_name || 'Casa'} <img src="${step.casa_logo || '/public/assets/casa-default.svg'}" alt="" width="18" height="18" style="vertical-align:middle" /></h4>
                    <div class="odd">${Number(step.odd_casa).toFixed(2)}</div>
                    <div class="fg-meta">Sugerido ~ ${prev.houseStake.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</div>
                  </div>
                </div>
                <form class="fg-form entry-form">
                  <label>Stake FUTGRN (R$)
                    <input name="stake" type="number" min="1" step="0.01" value="${stakeDefault}" required />
                  </label>
                  <button class="fg-btn" type="submit">Apostar na FUTGRN</button>
                </form>
              </article>`;
            }),
        )
        .join('');

      grade.querySelectorAll('.entry-form').forEach((form) => {
        form.onsubmit = async (e) => {
          e.preventDefault();
          const art = form.closest('.fg-match');
          const stake = Number(new FormData(form).get('stake'));
          try {
            await api('/api/futgreen/desafio-register', {
              method: 'POST',
              body: {
                desafio_id: art.dataset.desafio,
                step_id: art.dataset.step,
                stake,
              },
            });
            toast('Entrada registrada');
            await Promise.all([loadJourney(), loadGrade()]);
          } catch (err) {
            toast(err.message);
          }
        };
      });
    }

    await Promise.all([loadJourney(), loadGrade()]);
  </script>
</body>
</html>
