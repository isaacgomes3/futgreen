<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/public/brand/favicon.svg" type="image/svg+xml" />
  <title>Desafio · ARBISHIELD</title>
  <link rel="stylesheet" href="/public/css/futgreen.css" />
</head>
<body>
  <div class="fg-shell" id="fg-shell-root">
    <main class="fg-main">
      <section class="fg-section">
        <h2>Desafio ARBISHIELD</h2>
        <p class="lead">Indicações ArbiShield para vencer na BetBra · até 5 etapas · entrada sai da Carteira Desafio.</p>
        <div id="lock" class="fg-empty" hidden></div>
        <div id="grade" class="fg-grid fg-ind-grid"></div>
      </section>
      <section class="fg-section">
        <h3 class="fg-finished-title">Desafios finalizados</h3>
        <p class="fg-meta" style="margin-top:-0.35rem">Resultados · etapas que já foram liquidadas</p>
        <div id="finished" class="fg-finished-list"></div>
      </section>
    </main>
  </div>

  <!-- Entrada na indicação ArbiShield -->
  <div id="entry-modal" class="fg-modal" hidden>
    <div class="fg-modal-backdrop" data-act="close"></div>
    <div class="fg-modal-panel" role="dialog" aria-modal="true" aria-labelledby="entry-modal-title">
      <button type="button" class="fg-modal-x" data-act="close" aria-label="Fechar">×</button>
      <h3 id="entry-modal-title">Entrada · Desafio ARBISHIELD</h3>
      <p id="entry-modal-event" class="fg-meta"></p>
      <div class="fg-prot-locked">
        <div>
          <span class="fg-meta" style="margin:0">Indicação</span>
          <strong id="entry-modal-team">—</strong>
        </div>
        <div>
          <span class="fg-meta" style="margin:0">Lado</span>
          <strong id="entry-modal-side" class="fg-prot-side is-back">ARBISHIELD</strong>
        </div>
        <div>
          <span class="fg-meta" style="margin:0">Odd</span>
          <strong id="entry-modal-odd">—</strong>
        </div>
      </div>
      <form id="entry-form" class="fg-form">
        <label>
          Stake ARBISHIELD (R$)
          <input name="stake" type="number" step="0.01" min="1" value="50" required autocomplete="off" />
        </label>
        <div id="entry-preview" class="fg-prot-preview"></div>
        <button class="fg-btn" type="submit">Confirmar entrada</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { mountShell } from '/public/js/v2-shell.js';
    import { api, toast, fmtWhen, brl } from '/public/js/api.js';
    import { previewSinal } from '/public/js/desafio-ciclo-math.js';

    const me = await mountShell();
    const grade = document.getElementById('grade');
    const finishedBox = document.getElementById('finished');
    const lock = document.getElementById('lock');
    const modal = document.getElementById('entry-modal');
    const form = document.getElementById('entry-form');
    let current = null;
    let byKey = {};
    let unlockedWallet = false;

    const BETBRA_ICON = `<svg class="fg-betbra-mark" viewBox="0 0 64 64" width="22" height="22" aria-hidden="true">
      <g transform="translate(32 32) skewX(-10) translate(-32 -32)">
        <path fill="#00A651" d="M13 7h21c9.5 0 16 5.4 16 13.6 0 5-2.6 9-7 10.9 5.4 1.6 9 6.2 9 12.4C52 55.2 44.6 61 33.8 61H13V7z"/>
        <path fill="#0a0e0c" d="M25 17h9.2c4.2 0 6.6 2 6.6 5.4s-2.4 5.4-6.6 5.4H25V17z"/>
        <path fill="#0a0e0c" d="M25 37h10.4c4.8 0 7.6 2.6 7.6 6.8S40.2 51 35.4 51H25V37z"/>
        <rect x="9" y="6" width="13" height="52" rx="1.5" fill="#FFCC29"/>
        <circle cx="35" cy="38" r="17" fill="#FFCC29"/>
        <circle cx="35" cy="38" r="7.5" fill="#3E5FBF"/>
      </g>
    </svg>`;

    function betbraMarketUrl(step) {
      if (!step) return null;
      if (step.exchange_url) return step.exchange_url;
      const eventId = step.external_id;
      if (!eventId) return null;
      return `https://betbra.bet.br/b/exchange/sport/soccer/event/${encodeURIComponent(eventId)}`;
    }

    function betbraLinkHtml(url, { compact = false, label = 'BetBra' } = {}) {
      if (!url) return '';
      if (compact) {
        return `<a class="fg-ind-betbra" href="${url}" target="_blank" rel="noopener" title="Abrir na BetBra" data-act="betbra">${BETBRA_ICON}<span class="fg-sr-only">BetBra</span></a>`;
      }
      return `<a class="fg-ind-betbra fg-ind-betbra-label" href="${url}" target="_blank" rel="noopener" title="Abrir na BetBra" data-act="betbra">${BETBRA_ICON}<span>${label}</span></a>`;
    }

    /** Prefixo de clube no início → usar o segundo nome (FC Porto → Porto). */
    const TEAM_PREFIX = /^(fc|ac|sc|st|cf|cd|afc|as|ss|sv|rc|rcd|ud|sd|bk|fk|sk|nk|vk)$/i;

    function shortTeamName(name) {
      const raw = String(name || '').trim();
      if (!raw) return '—';
      const parts = raw.split(/\s+/).filter(Boolean);
      if (parts.length <= 1) return raw;
      if (TEAM_PREFIX.test(parts[0])) return parts[1] || parts[0];
      return parts[0];
    }

    function fmtKickBadge(iso) {
      if (!iso) return '—';
      try {
        const d = new Date(iso);
        const now = new Date();
        const sameDay = d.toDateString() === now.toDateString();
        const tomorrow = new Date(now);
        tomorrow.setDate(now.getDate() + 1);
        const isTomorrow = d.toDateString() === tomorrow.toDateString();
        const hm = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        if (sameDay) return `Hoje ${hm}`;
        if (isTomorrow) return `Amanhã ${hm}`;
        return d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
      } catch {
        return fmtWhen(iso);
      }
    }

    function kickoffPassed(startsAt, now = Date.now()) {
      const t = new Date(startsAt || 0).getTime();
      return Number.isFinite(t) && t > 0 && now >= t;
    }

    function stepClosed(step) {
      return step.status === 'live' || step.status === 'done' || kickoffPassed(step.starts_at);
    }

    function isStepLive(step) {
      return Boolean(
        step.match_live ||
          step.match_finished ||
          step.match_phase === 'finished' ||
          step.match_phase === '1h' ||
          step.match_phase === '2h' ||
          step.match_phase === 'ht' ||
          step.match_phase === 'live',
      );
    }

    function statusBadgeHtml(step) {
      if (step.status === 'done') {
        return `<span class="fg-ind-when fg-ind-when-ft">Encerrado</span>`;
      }
      if (isStepLive(step) || stepClosed(step)) {
        return `<span class="fg-ind-when fg-ind-when-live"><span class="fg-ind-live-dot" aria-hidden="true"></span>Ao vivo</span>`;
      }
      return `<span class="fg-ind-when">${fmtKickBadge(step.starts_at)}</span>`;
    }

    function matchClockHtml(step) {
      if (step.status === 'done') {
        return `<div class="fg-ind-clock">Encerrado · placar final</div>`;
      }
      if (!isStepLive(step) && !stepClosed(step)) return '';
      if (step.match_finished || step.match_phase === 'finished') {
        return `<div class="fg-ind-clock">Encerrado · placar final</div>`;
      }
      const clock = step.match_phase === 'ht' ? 'Intervalo' : (step.match_clock || "1'");
      const badge = step.match_phase === 'ht' ? '' : (step.match_badge || '');
      const label = badge && clock !== badge ? `${clock} · ${badge}` : clock;
      return `<div class="fg-ind-clock"><span class="fg-ind-live-dot" aria-hidden="true"></span>${label}</div>`;
    }

    const LEAGUE_STOP = /^(de|da|do|dos|das|del|la|el|los|las|the|of|e|y|and|und|di|du|des|a|o)$/i;
    function shortLeagueName(name) {
      const raw = String(name || '').trim();
      if (!raw) return 'Futebol';
      const parts = raw.split(/[\s/|·]+/).filter((w) => w && !LEAGUE_STOP.test(w));
      if (!parts.length) return raw.length > 18 ? `${raw.slice(0, 16)}…` : raw;
      if (parts.length === 1) return parts[0].length > 18 ? `${parts[0].slice(0, 16)}…` : parts[0];
      const out = `${parts[0]} ${parts[1]}`;
      return out.length > 22 ? parts[0].slice(0, 18) : out;
    }

    function teamRowHtml(name, logo, score) {
      const scoreHtml = score == null ? '' : `<span class="fg-ind-team-score">${score}</span>`;
      return `
        <div class="fg-ind-team">
          <div class="fg-ind-team-main">
            <img src="${logo || '/public/assets/casa-default.svg'}" alt="" width="30" height="30"
              onerror="this.onerror=null;this.src='/public/assets/casa-default.svg'" />
            <strong title="${name}">${shortTeamName(name)}</strong>
          </div>
          ${scoreHtml}
        </div>`;
    }

    function resultLabel(step) {
      if (step.result === 'zebra_protected') return 'Indicação venceu (ARBISHIELD)';
      if (step.result === 'win') return 'Casa venceu';
      if (step.result === 'empate_anula') return 'Empate anula';
      return 'Liquidado';
    }

    function stepCardHtml(desafio, step) {
      const zebraTeam = step.bet_team_side === 'away' ? step.away_team : step.home_team;
      const closed = stepClosed(step);
      const canEnter = !closed && unlockedWallet;
      const key = `${desafio.id}|${step.id}`;
      const bg = step.home_logo || step.away_logo ? '/public/assets/hero-stadium.jpg' : '/public/assets/hero-stadium.jpg';
      return `
      <article class="fg-match fg-ind-card${closed ? ' is-finished' : ''}" data-key="${key}">
        <div class="fg-ind-media" aria-hidden="true">
          <img class="fg-ind-photo" src="${bg}" alt="" loading="lazy" />
        </div>
        <div class="fg-ind-veil" aria-hidden="true"></div>
        <div class="fg-ind-body">
          <div class="fg-ind-top">
            ${statusBadgeHtml(step)}
            <span class="fg-ind-league" title="${step.league || desafio.title}">${shortLeagueName(step.league || desafio.title)}</span>
          </div>
          <div class="fg-ind-teams">
            ${teamRowHtml(step.home_team, step.home_logo, step.status === 'done' ? (step.home_score ?? 0) : (isStepLive(step) ? (step.display_home_score ?? step.home_score ?? 0) : null))}
            ${teamRowHtml(step.away_team, step.away_logo, step.status === 'done' ? (step.away_score ?? 0) : (isStepLive(step) ? (step.display_away_score ?? step.away_score ?? 0) : null))}
          </div>
          ${matchClockHtml(step)}
          <div class="fg-ind-list">
            <div class="fg-ind-list-head-row">
              <div class="fg-ind-list-head">Indicação: ${shortTeamName(zebraTeam)} · mercado ${step.market_flag || 'dnb'}</div>
            </div>
            <div class="fg-ind-mkt-row">
              <button type="button" class="fg-ind-mkt${!canEnter ? ' is-locked' : ''}" data-act="enter"
                ${!canEnter ? `disabled title="${closed ? 'Partida iniciada — entrada encerrada' : 'Deposite na Carteira Desafio para entrar'}"` : ''}>
                <span class="fg-ind-mkt-line">
                  <span class="fg-ind-mkt-main">
                    <strong>ARBISHIELD</strong>
                    <span class="fg-meta" style="margin:0">Liq. ${brl((step.liquidity || 0) * 100)}</span>
                  </span>
                  <span class="fg-ind-mkt-odds">
                    <span class="fg-prot-side is-back">ARBISHIELD</span>
                    <strong>${Number(step.odd_futgreen).toFixed(2)}</strong>
                  </span>
                </span>
              </button>
            </div>
            <div class="fg-ind-mkt-row">
              <div class="fg-ind-mkt" style="cursor:default">
                <span class="fg-ind-mkt-line">
                  <span class="fg-ind-mkt-main" style="flex-direction:row;align-items:center;gap:0.5rem">
                    ${BETBRA_ICON}
                    <span>
                      <strong>BetBra</strong>
                      <span class="fg-meta" style="margin:0;display:block">Referência</span>
                    </span>
                  </span>
                  <span class="fg-ind-mkt-odds">
                    <span class="fg-prot-side is-lay">BETBRA</span>
                    <strong>${Number(step.odd_casa).toFixed(2)}</strong>
                  </span>
                </span>
              </div>
              ${betbraLinkHtml(betbraMarketUrl(step), { compact: true })}
            </div>
          </div>
        </div>
      </article>`;
    }

    function finishedListHtml(items) {
      if (!items.length) {
        return '<p class="fg-empty">Nenhum desafio finalizado ainda.</p>';
      }
      return items
        .map(({ desafio, step }) => {
          const home = shortTeamName(step.home_team);
          const away = shortTeamName(step.away_team);
          const hs = step.home_score;
          const as = step.away_score;
          const hasScore = hs != null && as != null;
          return `
            <article class="fg-finished-row">
              <div class="fg-finished-event">
                <strong title="${step.home_team} × ${step.away_team}">${home} × ${away}</strong>
                <span class="fg-meta" title="${desafio.title}">${resultLabel(step)}</span>
              </div>
              <div class="fg-finished-when">${fmtWhen(step.starts_at)}</div>
              <div class="fg-finished-score" title="Placar final">
                ${hasScore ? `<span>${hs}</span><span class="fg-ind-score-sep">–</span><span>${as}</span>` : '—'}
              </div>
            </article>`;
        })
        .join('');
    }

    function closeModal() {
      current = null;
      modal.hidden = true;
    }

    function renderPreview(step, stakeReais) {
      const el = document.getElementById('entry-preview');
      if (!(stakeReais > 0)) {
        el.innerHTML = '<p class="fg-meta" style="margin:0">Informe o valor para ver o cálculo.</p>';
        return;
      }
      const prev = previewSinal(step, stakeReais);
      el.innerHTML = `
        <div class="fg-prot-preview-grid">
          <div><span>Se a indicação vencer</span><strong>${brl(Math.round(prev.payoutIfZebra * 100))}</strong></div>
        </div>
        <p class="fg-meta" style="margin:0.45rem 0 0">
          Se a indicação não vencer (Casa ou Empate Anula): sem crédito adicional — stake permanece com a plataforma
          exceto Empate Anula, que estorna integralmente na Carteira Desafio.
        </p>`;
    }

    function openEntryModal(desafio, step) {
      if (me.impersonating) return toast('Espelho: Desafio é readonly');
      if (stepClosed(step)) return toast('Partida já iniciada — entrada encerrada');
      if (!unlockedWallet) return toast('Deposite na Carteira Desafio para entrar');
      current = { desafio, step };
      const zebraTeam = step.bet_team_side === 'away' ? step.away_team : step.home_team;
      document.getElementById('entry-modal-event').textContent =
        `${step.home_team} × ${step.away_team} · ${fmtWhen(step.starts_at)}`;
      document.getElementById('entry-modal-team').textContent = zebraTeam;
      document.getElementById('entry-modal-odd').textContent = Number(step.odd_futgreen).toFixed(2);
      form.stake.value = '50';
      renderPreview(step, 50);
      modal.hidden = false;
      form.stake.focus();
    }

    function bindCards(root) {
      root.querySelectorAll('[data-act="enter"]').forEach((btn) => {
        btn.onclick = () => {
          const art = btn.closest('.fg-ind-card');
          const item = byKey[art.dataset.key];
          if (!item) return;
          openEntryModal(item.desafio, item.step);
        };
      });
    }

    modal.querySelectorAll('[data-act="close"]').forEach((el) => {
      el.onclick = closeModal;
    });
    form.stake.addEventListener('input', () => {
      if (!current) return;
      renderPreview(current.step, Number(form.stake.value));
    });
    form.onsubmit = async (e) => {
      e.preventDefault();
      if (!current) return;
      const stake = Number(form.stake.value);
      if (!(stake > 0)) return toast('Informe o valor da entrada');
      try {
        await api('/api/futgreen/desafio-register', {
          method: 'POST',
          body: { desafio_id: current.desafio.id, step_id: current.step.id, stake },
        });
        toast('Entrada registrada');
        closeModal();
        await load();
      } catch (err) {
        toast(err.message);
      }
    };

    async function load() {
      // preview=1: mostra a vitrine de desafios publicados mesmo com a Carteira Desafio vazia;
      // a entrada (aposta) continua bloqueada até o depósito, via unlocked.
      const data = await api('/api/futgreen/desafios?preview=1');
      unlockedWallet = Boolean(data.unlocked);

      if (!unlockedWallet) {
        lock.hidden = false;
        lock.innerHTML = `Carteira Desafio vazia — você pode ver os desafios, mas precisa depositar para entrar. <a href="/app-carteira.html">Ir à Carteira</a>`;
      } else {
        lock.hidden = true;
      }

      const open = [];
      const finished = [];
      byKey = {};
      for (const { desafio, steps } of data.desafios || []) {
        for (const step of steps || []) {
          const key = `${desafio.id}|${step.id}`;
          byKey[key] = { desafio, step };
          if (step.status === 'done') finished.push({ desafio, step });
          else open.push({ desafio, step });
        }
      }
      open.sort((a, b) => new Date(a.step.starts_at || 0) - new Date(b.step.starts_at || 0));
      finished.sort((a, b) => new Date(b.step.starts_at || 0) - new Date(a.step.starts_at || 0));

      grade.innerHTML = open.length
        ? open.map(({ desafio, step }) => stepCardHtml(desafio, step)).join('')
        : '<p class="fg-empty">Nenhum desafio publicado no momento.</p>';
      bindCards(grade);

      finishedBox.innerHTML = finishedListHtml(finished);
    }

    await load();
  </script>
</body>
</html>
