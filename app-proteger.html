<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/public/brand/favicon.svg" type="image/svg+xml" />
  <title>Proteger Aposta · FUTGRN</title>
  <link rel="stylesheet" href="/public/css/futgreen.css?v=liqbar1" />
</head>
<body>
  <div class="fg-shell" id="fg-shell-root">
    <main class="fg-main">
      <section class="fg-section">
        <h2>Proteger Aposta</h2>
        <p class="lead">Indicações FutGreen · clique no mercado para informar o valor da entrada na BetBra.</p>
        <div id="matches" class="fg-grid fg-ind-grid"></div>
      </section>
      <section class="fg-section">
        <h3 class="fg-finished-title">Eventos finalizados</h3>
        <p class="fg-meta" style="margin-top:-0.35rem">Resultados do dia · eventos que estiveram na sua fila</p>
        <div id="finished" class="fg-finished-list"></div>
      </section>
    </main>
  </div>

  <!-- Lista todos os mercados do evento -->
  <div id="markets-modal" class="fg-modal" hidden>
    <div class="fg-modal-backdrop" data-act="close-markets"></div>
    <div class="fg-modal-panel fg-modal-panel-wide" role="dialog" aria-modal="true" aria-labelledby="markets-modal-title">
      <button type="button" class="fg-modal-x" data-act="close-markets" aria-label="Fechar">×</button>
      <h3 id="markets-modal-title">Mercados do evento</h3>
      <p id="markets-modal-event" class="fg-meta"></p>
      <div id="markets-modal-list" class="fg-ind-list fg-ind-list-modal"></div>
    </div>
  </div>

  <!-- Entrada / ativar proteção -->
  <div id="prot-modal" class="fg-modal" hidden>
    <div class="fg-modal-backdrop" data-act="close"></div>
    <div class="fg-modal-panel" role="dialog" aria-modal="true" aria-labelledby="prot-modal-title">
      <button type="button" class="fg-modal-x" data-act="close" aria-label="Fechar">×</button>
      <h3 id="prot-modal-title">Entrada indicada</h3>
      <p id="prot-modal-event" class="fg-meta"></p>
      <div class="fg-prot-locked">
        <div>
          <span class="fg-meta" style="margin:0">Mercado</span>
          <strong id="prot-modal-market">—</strong>
        </div>
        <div>
          <span class="fg-meta" style="margin:0">Lado</span>
          <strong id="prot-modal-side" class="fg-prot-side">—</strong>
        </div>
        <div>
          <span class="fg-meta" style="margin:0">Odd ao vivo</span>
          <strong id="prot-modal-odd">—</strong>
          <span id="prot-modal-odd-src" class="fg-meta" style="margin:0"></span>
        </div>
      </div>
      <form id="prot-modal-form" class="fg-form">
        <label>
          <span id="prot-amount-title">Valor da entrada (R$)</span>
          <input name="amount" type="number" step="0.01" min="1" value="100" required autocomplete="off" />
        </label>
        <p class="fg-meta" id="prot-amount-hint" style="margin-top:-0.35rem"></p>
        <div id="prot-preview" class="fg-prot-preview"></div>
        <button class="fg-btn" type="submit">Ativar proteção</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { mountShell } from '/public/js/v2-shell.js';
    import { api, toast, fmtWhen, brl } from '/public/js/api.js';
    import { teamBlock } from '/public/js/teams-ui.js';
    import { calcIndicationEconomics } from '/public/js/protection-math.js';

    const FRONT_LIMIT = 2;
    const me = await mountShell();
    const box = document.getElementById('matches');
    const finishedBox = document.getElementById('finished');
    const modal = document.getElementById('prot-modal');
    const marketsModal = document.getElementById('markets-modal');
    const form = document.getElementById('prot-modal-form');
    let liveTimer = null;
    let current = null;
    /** @type {Map<string, any>} */
    let eventsByKey = new Map();
    let byId = {};

    /** Fase do card: usa API se já veio live/FT; senão calcula pelo starts_at. */
    function derivePhaseLocal(m, now = Date.now()) {
      if (m.settled_at || m.finished_at || m.match_finished || m.match_phase === 'finished') {
        return {
          phase: 'finished',
          clock: 'FT',
          badge: 'Encerrado',
          live: false,
          finished: true,
          home_score: m.display_home_score ?? m.home_score ?? 0,
          away_score: m.display_away_score ?? m.away_score ?? 0,
        };
      }
      const apiLive =
        m.match_live ||
        m.match_phase === 'live' ||
        m.match_phase === '1h' ||
        m.match_phase === '2h' ||
        m.match_phase === 'ht';
      if (apiLive) {
        return {
          phase: m.match_phase || 'live',
          clock: m.match_clock || "1'",
          badge: m.match_badge || 'Ao vivo',
          live: true,
          finished: false,
          home_score: m.display_home_score ?? m.home_score ?? 0,
          away_score: m.display_away_score ?? m.away_score ?? 0,
        };
      }
      const start = new Date(m.starts_at || 0).getTime();
      if (!Number.isFinite(start) || now < start) {
        return {
          phase: 'scheduled',
          clock: null,
          badge: null,
          live: false,
          finished: false,
          home_score: null,
          away_score: null,
        };
      }
      const elapsed = now - start;
      const HALF = 45 * 60e3;
      const HT = 15 * 60e3;
      let phase = '1h';
      let clock = "1'";
      let badge = '1º tempo';
      if (elapsed <= HALF) {
        clock = `${Math.max(1, Math.floor(elapsed / 60e3))}'`;
      } else if (elapsed <= HALF + HT) {
        phase = 'ht';
        clock = 'HT';
        badge = 'Intervalo';
      } else if (elapsed <= HALF + HT + HALF + 15 * 60e3) {
        phase = '2h';
        const second = Math.floor((elapsed - HALF - HT) / 60e3);
        const display = 45 + Math.min(second, 45);
        clock = display >= 90 ? "90'+" : `${display}'`;
        badge = '2º tempo';
      } else {
        // Tempo esgotado → encerra no card (placar final)
        return {
          phase: 'finished',
          clock: 'FT',
          badge: 'Encerrado',
          live: false,
          finished: true,
          home_score: m.display_home_score ?? m.home_score ?? 0,
          away_score: m.display_away_score ?? m.away_score ?? 0,
        };
      }
      return {
        phase,
        clock,
        badge,
        live: true,
        finished: false,
        home_score: m.display_home_score ?? m.home_score ?? 0,
        away_score: m.display_away_score ?? m.away_score ?? 0,
      };
    }

    function mergePhase(g, m) {
      const local = derivePhaseLocal(m);
      const rank = { finished: 3, live: 2, '1h': 2, '2h': 2, ht: 2, scheduled: 1, unknown: 0 };
      const cur = rank[g.match_phase] || 0;
      const next = rank[local.phase] || 0;
      if (next >= cur) {
        g.match_phase = local.phase || g.match_phase;
        g.match_clock = local.clock ?? g.match_clock;
        g.match_badge = local.badge || g.match_badge;
        g.match_live = Boolean(local.live || g.match_live);
        g.match_finished = Boolean(local.finished || g.match_finished);
      }
      if (local.home_score != null) g.home_score = local.home_score;
      if (local.away_score != null) g.away_score = local.away_score;
      if (m.settled_at) g.settled_at = m.settled_at;
      if (m.finished_at) g.finished_at = m.finished_at;
    }

    function groupByEvent(matches) {
      const map = new Map();
      for (const m of matches) {
        const key = m.external_id || `${m.home_team}|${m.away_team}|${m.starts_at}`;
        const local = derivePhaseLocal(m);
        if (!map.has(key)) {
          map.set(key, {
            key,
            home_team: m.home_team,
            away_team: m.away_team,
            home_logo: m.home_logo,
            away_logo: m.away_logo,
            card_bg: m.card_bg || m.home_art || m.away_art || null,
            card_bg_team: m.card_bg_team || null,
            league: m.league,
            starts_at: m.starts_at,
            home_score: local.home_score,
            away_score: local.away_score,
            match_phase: local.phase,
            match_clock: local.clock,
            match_badge: local.badge,
            match_live: local.live,
            match_finished: local.finished,
            settled_at: m.settled_at || null,
            finished_at: m.finished_at || null,
            external_id: m.external_id || null,
            exchange_url: betbraMarketUrl(m),
            indications: [],
          });
        } else {
          const g = map.get(key);
          if (!g.card_bg && (m.card_bg || m.home_art || m.away_art)) {
            g.card_bg = m.card_bg || m.home_art || m.away_art;
            g.card_bg_team = m.card_bg_team || null;
          }
          if (!g.home_logo && m.home_logo) g.home_logo = m.home_logo;
          if (!g.away_logo && m.away_logo) g.away_logo = m.away_logo;
          if (!g.external_id && m.external_id) g.external_id = m.external_id;
          if (!g.exchange_url) g.exchange_url = betbraMarketUrl(m);
          mergePhase(g, m);
        }
        map.get(key).indications.push(m);
      }
      return [...map.values()];
    }

    const BETBRA_ICON = `<svg class="fg-betbra-mark" viewBox="0 0 64 64" width="18" height="18" aria-hidden="true">
      <g transform="translate(32 32) skewX(-10) translate(-32 -32)">
        <path fill="#00A651" d="M13 7h21c9.5 0 16 5.4 16 13.6 0 5-2.6 9-7 10.9 5.4 1.6 9 6.2 9 12.4C52 55.2 44.6 61 33.8 61H13V7z"/>
        <path fill="#0a0e0c" d="M25 17h9.2c4.2 0 6.6 2 6.6 5.4s-2.4 5.4-6.6 5.4H25V17z"/>
        <path fill="#0a0e0c" d="M25 37h10.4c4.8 0 7.6 2.6 7.6 6.8S40.2 51 35.4 51H25V37z"/>
        <rect x="9" y="6" width="13" height="52" rx="1.5" fill="#FFCC29"/>
        <circle cx="35" cy="38" r="17" fill="#FFCC29"/>
        <circle cx="35" cy="38" r="7.5" fill="#3E5FBF"/>
      </g>
    </svg>`;

    function betbraMarketUrl(m) {
      if (!m) return null;
      if (m.exchange_url) return m.exchange_url;
      const eventId = m.external_id;
      if (!eventId) return null;
      const base = `https://betbra.bet.br/b/exchange/sport/soccer/event/${encodeURIComponent(eventId)}`;
      return m.market_id ? `${base}/market/${encodeURIComponent(m.market_id)}` : base;
    }

    function betbraLinkHtml(url, { compact = false, label = 'BetBra' } = {}) {
      if (!url) return '';
      if (compact) {
        return `<a class="fg-ind-betbra" href="${url}" target="_blank" rel="noopener" title="Abrir mercado na BetBra" data-act="betbra">${BETBRA_ICON}<span class="fg-sr-only">BetBra</span></a>`;
      }
      return `<a class="fg-ind-betbra fg-ind-betbra-label" href="${url}" target="_blank" rel="noopener" title="Abrir mercado na BetBra" data-act="betbra">${BETBRA_ICON}<span>${label}</span></a>`;
    }

    /** Prefixo de clube no início → usar o segundo nome (FC Porto → Porto). */
    const TEAM_PREFIX = /^(fc|ac|sc|st|cf|cd|afc|as|ss|sv|rc|rcd|ud|sd|bk|fk|sk|nk|vk)$/i;
    const LEAGUE_STOP = /^(de|da|do|dos|das|del|la|el|los|las|the|of|e|y|and|und|di|du|des|a|o)$/i;

    /** Nome curto no card: 1ª palavra; se começar com FC/AC/ST/…, a 2ª. */
    function shortTeamName(name) {
      const raw = String(name || '').trim();
      if (!raw) return '—';
      const parts = raw.split(/\s+/).filter(Boolean);
      if (parts.length <= 1) return raw;
      if (TEAM_PREFIX.test(parts[0])) return parts[1] || parts[0];
      return parts[0];
    }

    /** Campeonato curto no card: no máx. 2 palavras (sem “de/da/the…”). */
    function shortLeagueName(name) {
      const raw = String(name || '').trim();
      if (!raw) return 'Futebol';
      const parts = raw.split(/[\s/|·]+/).filter((w) => w && !LEAGUE_STOP.test(w));
      if (!parts.length) return raw.length > 18 ? `${raw.slice(0, 16)}…` : raw;
      if (parts.length === 1) return parts[0].length > 18 ? `${parts[0].slice(0, 16)}…` : parts[0];
      const out = `${parts[0]} ${parts[1]}`;
      return out.length > 22 ? parts[0].slice(0, 18) : out;
    }

    function isEventLive(ev) {
      return Boolean(
        ev.match_live ||
          ev.match_finished ||
          ev.match_phase === 'finished' ||
          ev.match_phase === '1h' ||
          ev.match_phase === '2h' ||
          ev.match_phase === 'ht' ||
          ev.match_phase === 'live',
      );
    }

    function statusBadgeHtml(ev) {
      if (ev.match_finished || ev.match_phase === 'finished') {
        return `<span class="fg-ind-when fg-ind-when-ft">Encerrado</span>`;
      }
      if (isEventLive(ev)) {
        return `<span class="fg-ind-when fg-ind-when-live"><span class="fg-ind-live-dot" aria-hidden="true"></span>Ao vivo</span>`;
      }
      return `<span class="fg-ind-when">${fmtKickBadge(ev.starts_at)}</span>`;
    }

    function teamRowHtml(name, logo, score) {
      const scoreHtml =
        score == null
          ? ''
          : `<span class="fg-ind-team-score">${score}</span>`;
      return `
        <div class="fg-ind-team">
          <div class="fg-ind-team-main">
            ${logo ? `<img src="${logo}" alt="" width="28" height="28" />` : ''}
            <strong title="${name}">${shortTeamName(name)}</strong>
          </div>
          ${scoreHtml}
        </div>`;
    }

    function matchClockHtml(ev) {
      if (!isEventLive(ev)) return '';
      if (ev.match_finished || ev.match_phase === 'finished') {
        return `<div class="fg-ind-clock">Encerrado · placar final</div>`;
      }
      const clock = ev.match_phase === 'ht' ? 'Intervalo' : (ev.match_clock || "1'");
      const badge = ev.match_phase === 'ht' ? '' : (ev.match_badge || '');
      const label = badge && clock !== badge ? `${clock} · ${badge}` : clock;
      return `<div class="fg-ind-clock"><span class="fg-ind-live-dot" aria-hidden="true"></span>${label}</div>`;
    }

    function fmtKickBadge(iso) {
      if (!iso) return '—';
      try {
        const d = new Date(iso);
        const now = new Date();
        const sameDay = d.toDateString() === now.toDateString();
        const tomorrow = new Date(now);
        tomorrow.setDate(now.getDate() + 1);
        const isTomorrow = d.toDateString() === tomorrow.toDateString();
        const hm = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        if (sameDay) return `Hoje ${hm}`;
        if (isTomorrow) return `Amanhã ${hm}`;
        return d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
      } catch {
        return fmtWhen(iso);
      }
    }

    function kickoffPassed(startsAt, now = Date.now()) {
      const t = new Date(startsAt || 0).getTime();
      return Number.isFinite(t) && t > 0 && now >= t;
    }

    function protectionEntryClosed(m) {
      if (!m) return true;
      return (
        kickoffPassed(m.starts_at) ||
        !!m.match_live ||
        m.match_phase === 'live' ||
        !!m.match_finished ||
        m.match_phase === 'finished'
      );
    }

    function liquidityBarHtml(m) {
      const total = Number(m.liquidity);
      if (!(total > 0)) return '';
      const used = Number(m.liquidity_used) || 0;
      const rem = Number(m.liquidity_remaining);
      const remaining = Number.isFinite(rem) ? rem : Math.max(0, total - used);
      const pctRem = Math.max(
        0,
        Math.min(100, Number(m.liquidity_pct_remaining) || (total > 0 ? (remaining / total) * 100 : 0)),
      );
      const empty = remaining <= 0;
      return `
        <span class="fg-ind-liq${empty ? ' is-empty' : ''}" aria-label="Liquidez disponível ${remaining} de ${total}">
          <span class="fg-ind-liq-track">
            <span class="fg-ind-liq-fill" style="width:${pctRem.toFixed(1)}%"></span>
          </span>
          <span class="fg-ind-liq-meta">
            <em>${brl(Math.round(remaining * 100))}</em>
            <span>disp. de ${brl(Math.round(total * 100))}</span>
          </span>
        </span>`;
    }

    function marketButtonHtml(m) {
      const side = String(m.side || '—').toUpperCase();
      const odd = m.odd != null ? Number(m.odd).toFixed(2) : '—';
      const title = m.market_name || 'Mercado';
      const sel = m.selection_name || '';
      const url = betbraMarketUrl(m);
      const locked = protectionEntryClosed(m);
      const liqBar = liquidityBarHtml(m);
      const liqGone = Number(m.liquidity) > 0 && Number(m.liquidity_remaining) <= 0;
      return `
        <div class="fg-ind-mkt-row">
          <button type="button" class="fg-ind-mkt${locked ? ' is-locked' : ''}${liqBar ? ' has-liq' : ''}${liqGone ? ' is-liq-empty' : ''}" data-match-id="${m.id}"
            ${locked ? 'disabled title="Partida iniciada — proteção encerrada"' : liqGone ? 'disabled title="Liquidez esgotada"' : ''}>
            <span class="fg-ind-mkt-line">
              <span class="fg-ind-mkt-main">
                <strong>${title}</strong>
                <span class="fg-meta" style="margin:0">${locked ? 'Partida iniciada' : liqGone ? 'Liquidez esgotada' : sel}</span>
              </span>
              <span class="fg-ind-mkt-odds">
                <span class="fg-prot-side ${side === 'LAY' ? 'is-lay' : side === 'BACK' ? 'is-back' : ''}">${side}</span>
                <strong>${odd}</strong>
              </span>
            </span>
            ${liqBar}
          </button>
          ${betbraLinkHtml(url, { compact: true })}
        </div>`;
    }

    function renderPreview(side, odd, amountReais) {
      const el = document.getElementById('prot-preview');
      if (!(odd > 1) || !(amountReais > 0)) {
        el.innerHTML = '<p class="fg-meta" style="margin:0">Informe o valor para ver o cálculo.</p>';
        return;
      }
      const eco = calcIndicationEconomics({ side, amountReais, odd });
      el.innerHTML = `
        <div class="fg-prot-preview-grid">
          <div><span>Lucro bruto</span><strong>${brl(Math.round(eco.gross_profit_reais * 100))}</strong></div>
          <div><span>Seu 1% (sobre a entrada)</span><strong>${brl(Math.round(eco.client_share_reais * 100))}</strong></div>
          <div><span>Taxa BetBra 2,5%</span><strong>${brl(Math.round(eco.exchange_fee_reais * 100))}</strong></div>
          <div><span>FutGreen</span><strong>${brl(Math.round(eco.futgreen_share_reais * 100))}</strong></div>
        </div>
        <p class="fg-meta" style="margin:0.45rem 0 0">
          Sem trava de stake no Apostador. Se vencer na BetBra: sem débito.
          Se falhar: reembolso integral no Saldo Reembolso. Empate anula sem P&amp;L.
        </p>`;
    }

    function stopLive() {
      if (liveTimer) {
        clearInterval(liveTimer);
        liveTimer = null;
      }
    }

    function closeModal() {
      stopLive();
      current = null;
      modal.hidden = true;
      document.querySelectorAll('.fg-ind-card.is-open').forEach((c) => c.classList.remove('is-open'));
    }

    function closeMarketsModal() {
      marketsModal.hidden = true;
    }

    async function refreshOdd() {
      if (!current?.match?.id) return;
      if (protectionEntryClosed(current.match)) {
        closeModal();
        toast('Partida já iniciada — proteção não é mais aceita');
        return;
      }
      try {
        const data = await api(`/api/futgreen/match-live-odd?match_id=${encodeURIComponent(current.match.id)}`);
        if (data.odd != null && Number(data.odd) > 1) {
          current.match.odd = Number(data.odd);
          document.getElementById('prot-modal-odd').textContent = Number(data.odd).toFixed(2);
          document.getElementById('prot-modal-odd-src').textContent =
            data.source === 'betbra_live' ? '· ao vivo' : '· snapshot';
          renderPreview(current.match.side, current.match.odd, Number(form.amount.value));
        }
      } catch { /* poll silencioso */ }
    }

    function openEntryModal(match, eventLabel) {
      if (me.impersonating) return toast('Espelho: Proteger é readonly');
      if (protectionEntryClosed(match)) {
        return toast('Partida já iniciada — proteção não é mais aceita');
      }
      closeMarketsModal();
      current = { match: { ...match }, eventLabel };
      const side = String(match.side || 'LAY').toUpperCase();
      document.getElementById('prot-modal-event').textContent = eventLabel;
      document.getElementById('prot-modal-market').textContent =
        match.label || `${match.market_name || 'Mercado'} · ${match.selection_name || ''}`.trim();
      const sideEl = document.getElementById('prot-modal-side');
      sideEl.textContent = side;
      sideEl.className = `fg-prot-side ${side === 'LAY' ? 'is-lay' : 'is-back'}`;
      document.getElementById('prot-modal-odd').textContent =
        match.odd != null ? Number(match.odd).toFixed(2) : '—';
      document.getElementById('prot-modal-odd-src').textContent = '';
      const kind = side === 'BACK' ? 'stake (BACK)' : 'responsabilidade (LAY)';
      document.getElementById('prot-amount-title').textContent = `Valor da entrada · ${kind} (R$)`;
      const bbUrl = betbraMarketUrl(match);
      const liqTotal = Number(match.liquidity);
      const liqRem = Number(match.liquidity_remaining);
      const liqHint =
        liqTotal > 0
          ? ` Liquidez: ${brl(Math.round(Math.max(0, liqRem) * 100))} disponíveis de ${brl(Math.round(liqTotal * 100))}.`
          : '';
      document.getElementById('prot-amount-hint').innerHTML = bbUrl
        ? `${side === 'BACK'
            ? 'Informe a stake que você vai usar na BetBra neste BACK.'
            : 'Informe a responsabilidade (liability) que você vai usar na BetBra neste LAY.'}${liqHint}
           ${betbraLinkHtml(bbUrl, { label: 'Abrir mercado' })}`
        : `${side === 'BACK'
            ? 'Informe a stake que você vai usar na BetBra neste BACK.'
            : 'Informe a responsabilidade (liability) que você vai usar na BetBra neste LAY.'}${liqHint}`;
      const defaultAmt =
        liqTotal > 0 && Number.isFinite(liqRem) && liqRem > 0
          ? Math.min(100, Math.floor(liqRem))
          : 100;
      form.amount.value = String(defaultAmt > 0 ? defaultAmt : 100);
      if (liqTotal > 0 && liqRem > 0) {
        form.amount.max = String(liqRem);
      } else {
        form.amount.removeAttribute('max');
      }
      renderPreview(side, Number(match.odd), Number(form.amount.value));
      modal.hidden = false;
      form.amount.focus();
      stopLive();
      refreshOdd();
      liveTimer = setInterval(refreshOdd, 12000);
    }

    function bindMarketButtons(root) {
      root.querySelectorAll('.fg-ind-mkt').forEach((btn) => {
        btn.onclick = () => {
          const m = byId[btn.dataset.matchId];
          if (!m) return;
          if (btn.disabled || protectionEntryClosed(m)) {
            return toast('Partida já iniciada — proteção não é mais aceita');
          }
          if (Number(m.liquidity) > 0 && Number(m.liquidity_remaining) <= 0) {
            return toast('Liquidez esgotada neste mercado');
          }
          const evLabel = `${m.home_team} × ${m.away_team} · ${fmtWhen(m.starts_at)}`;
          btn.closest('.fg-ind-card')?.classList.add('is-open');
          openEntryModal(m, evLabel);
        };
      });
    }

    function openAllMarkets(eventKey) {
      const ev = eventsByKey.get(eventKey);
      if (!ev) return;
      const list = document.getElementById('markets-modal-list');
      document.getElementById('markets-modal-event').textContent =
        `${ev.home_team} × ${ev.away_team} · ${ev.league || ''} · ${fmtWhen(ev.starts_at)}`;
      document.getElementById('markets-modal-title').textContent =
        `Todos os mercados (${ev.indications.length})`;
      list.innerHTML = ev.indications.map(marketButtonHtml).join('')
        || '<p class="fg-empty">Nenhum mercado neste evento.</p>';
      bindMarketButtons(list);
      marketsModal.hidden = false;
    }

    function finishedListHtml(finishedMatches) {
      const events = groupByEvent(finishedMatches)
        .filter((ev) => ev.match_finished || ev.match_phase === 'finished' || ev.settled_at || ev.finished_at)
        .sort((a, b) => new Date(b.starts_at || 0) - new Date(a.starts_at || 0));
      if (!events.length) {
        return '<p class="fg-empty">Nenhum evento finalizado hoje.</p>';
      }
      return events
        .map((ev) => {
          const hs = ev.home_score ?? 0;
          const as = ev.away_score ?? 0;
          const home = shortTeamName(ev.home_team);
          const away = shortTeamName(ev.away_team);
          return `
            <article class="fg-finished-row">
              <div class="fg-finished-event">
                <strong title="${ev.home_team} × ${ev.away_team}">${home} × ${away}</strong>
                <span class="fg-meta" title="${ev.league || ''}">${shortLeagueName(ev.league)}</span>
              </div>
              <div class="fg-finished-when">${fmtWhen(ev.starts_at)}</div>
              <div class="fg-finished-score" title="Placar final">
                <span>${hs}</span><span class="fg-ind-score-sep">–</span><span>${as}</span>
              </div>
            </article>`;
        })
        .join('');
    }

    /** Só indicações lançadas pelo admin (lado + odd válidos). */
    function isAdminLaunch(m) {
      const side = String(m?.side || '').toUpperCase();
      const odd = Number(m?.odd);
      return (side === 'BACK' || side === 'LAY') && Number.isFinite(odd) && odd > 1;
    }

    async function load() {
      const data = await api('/api/futgreen/matches');
      const matches = (data.matches || []).filter(isAdminLaunch);
      const finished = (data.finished || []).filter(isAdminLaunch);
      byId = Object.fromEntries([...matches, ...finished].map((m) => [m.id, m]));

      if (!matches.length) {
        box.innerHTML = '<p class="fg-empty">Nenhuma indicação na fila.</p>';
        eventsByKey = new Map();
      } else {
        const events = groupByEvent(matches).filter(
          (ev) => !(ev.match_finished || ev.match_phase === 'finished'),
        );
        eventsByKey = new Map(events.map((e) => [e.key, e]));

        box.innerHTML = events
          .map((ev) => {
            const all = ev.indications;
            const front = all.slice(0, FRONT_LIMIT);
            const extra = Math.max(0, all.length - FRONT_LIMIT);
            const slots = [];
            for (let i = 0; i < FRONT_LIMIT; i++) {
              if (front[i]) slots.push(marketButtonHtml(front[i]));
              else slots.push(`<div class="fg-ind-mkt-row"><div class="fg-ind-mkt fg-ind-mkt-empty" aria-hidden="true"></div></div>`);
            }
            const moreLink =
              extra > 0
                ? `<button type="button" class="fg-ind-more" data-act="all" data-event-key="${ev.key}">
                     Todos os mercados (${all.length}) →
                   </button>`
                : all.length > 0
                  ? `<span class="fg-ind-more-spacer" aria-hidden="true"></span>`
                  : `<button type="button" class="fg-ind-more" disabled>Sem mercados</button>`;
            const eventBetbra = betbraLinkHtml(ev.exchange_url || betbraMarketUrl(ev), {
              label: 'Abrir BetBra',
            });
            const rawBg = ev.card_bg || '';
            const bgIsBadge = /\/badge\//i.test(rawBg);
            const bg = (!rawBg || bgIsBadge) ? '/public/assets/hero-stadium.jpg' : rawBg;
            const liveClass = ev.match_live && !ev.match_finished ? ' is-live' : '';
            const entryClosed = protectionEntryClosed(ev);
            return `
            <article class="fg-match fg-ind-card${liveClass}${entryClosed ? ' is-entry-closed' : ''}" data-event-key="${ev.key}">
              <div class="fg-ind-media" aria-hidden="true">
                <img class="fg-ind-photo" src="${bg}" alt="" loading="lazy" />
              </div>
              <div class="fg-ind-veil" aria-hidden="true"></div>
              <div class="fg-ind-body">
                <div class="fg-ind-top">
                  ${statusBadgeHtml(ev)}
                  <span class="fg-ind-league" title="${ev.league || 'Futebol'}">${shortLeagueName(ev.league)}</span>
                </div>
                <div class="fg-ind-teams">
                  ${teamRowHtml(ev.home_team, ev.home_logo, isEventLive(ev) ? (ev.home_score ?? 0) : null)}
                  ${teamRowHtml(ev.away_team, ev.away_logo, isEventLive(ev) ? (ev.away_score ?? 0) : null)}
                  ${matchClockHtml(ev)}
                </div>
                <div class="fg-ind-list">
                  <div class="fg-ind-list-head-row">
                    <div class="fg-ind-list-head">${entryClosed ? 'Proteção encerrada' : 'Mercados indicados'}</div>
                    ${eventBetbra}
                  </div>
                  ${slots.join('')}
                </div>
                <div class="fg-ind-foot">${moreLink}</div>
              </div>
            </article>`;
          })
          .join('') || '<p class="fg-empty">Nenhuma indicação na fila.</p>';

        bindMarketButtons(box);
        box.querySelectorAll('[data-act="all"]').forEach((btn) => {
          btn.onclick = () => openAllMarkets(btn.dataset.eventKey);
        });
      }

      finishedBox.innerHTML = finishedListHtml(finished);
    }

    let refreshTimer = null;
    function startRefresh() {
      if (refreshTimer) clearInterval(refreshTimer);
      refreshTimer = setInterval(() => {
        if (document.hidden) return;
        if (!modal.hidden || !marketsModal.hidden) return;
        load().catch(() => {});
      }, 20000);
    }

    modal.querySelectorAll('[data-act="close"]').forEach((el) => {
      el.onclick = closeModal;
    });
    marketsModal.querySelectorAll('[data-act="close-markets"]').forEach((el) => {
      el.onclick = closeMarketsModal;
    });

    form.amount.addEventListener('input', () => {
      if (!current) return;
      renderPreview(current.match.side, Number(current.match.odd), Number(form.amount.value));
    });

    form.onsubmit = async (e) => {
      e.preventDefault();
      if (!current) return;
      if (me.impersonating) return toast('Espelho: Proteger é readonly');
      if (protectionEntryClosed(current.match)) {
        closeModal();
        return toast('Partida já iniciada — proteção não é mais aceita');
      }
      const amount = Number(form.amount.value);
      const odd = Number(current.match.odd);
      const side = String(current.match.side || 'LAY').toUpperCase();
      if (!(amount > 0)) return toast('Informe o valor da entrada');
      if (!(odd > 1)) return toast('Odd indisponível — tente de novo');
      try {
        await api('/api/futgreen/protections', {
          method: 'POST',
          body: { match_id: current.match.id, side, odd, amount },
        });
        toast('Proteção ativada');
        closeModal();
        location.href = '/app-protecoes.html';
      } catch (err) {
        const msg = String(err.message || '');
        toast(/kickoff|iniciad/i.test(msg) ? 'Partida já iniciada — proteção não é mais aceita' : msg);
      }
    };

    await load();
    startRefresh();
  </script>
</body>
</html>
