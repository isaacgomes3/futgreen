<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/public/brand/favicon.svg" type="image/svg+xml" />
  <title>Carteira · FUTGRN</title>
  <link rel="stylesheet" href="/public/css/futgreen.css" />
</head>
<body>
  <div class="fg-shell" id="fg-shell-root">
    <main class="fg-main">
      <section class="fg-section">
        <h2>Carteira</h2>
        <div id="cards"></div>
      </section>
      <section class="fg-section">
        <h2>Movimentar</h2>
        <div class="fg-grid">
          <form id="transfer" class="fg-form fg-match">
            <h3 style="margin:0;font-family:var(--font-display)">Reembolso → Jornada</h3>
            <label>Valor (R$) <input name="amount" type="number" min="1" step="0.01" required /></label>
            <button class="fg-btn" type="submit">Transferir</button>
          </form>
          <form id="withdraw" class="fg-form fg-match">
            <h3 style="margin:0;font-family:var(--font-display)">Saque Saldo Reembolso</h3>
            <p class="fg-meta" style="margin:0">O valor fica reservado até o admin aprovar o pagamento.</p>
            <label>Valor (R$) <input name="amount" type="number" min="1" step="0.01" required /></label>
            <label>Chave PIX <input name="pix_key" type="text" placeholder="email ou CPF" /></label>
            <button class="fg-btn ghost" type="submit">Solicitar saque</button>
          </form>
          <form id="deposit" class="fg-form fg-match">
            <h3 style="margin:0;font-family:var(--font-display)">Comprovar depósito</h3>
            <label>Destino
              <select name="dest">
                <option value="apostador">Saldo Apostador</option>
                <option value="desafio">Carteira Jornada</option>
                <option value="provedor">Saldo Provedor</option>
              </select>
            </label>
            <label>Valor (R$) <input name="amount" type="number" min="1" step="0.01" required /></label>
            <button class="fg-btn ghost" type="submit">Enviar comprovante</button>
          </form>
        </div>
      </section>
      <section class="fg-section">
        <h2>Extrato</h2>
        <div id="extrato"></div>
      </section>
    </main>
  </div>
  <script type="module">
    import { mountShell } from '/public/js/v2-shell.js';
    import { api, toast } from '/public/js/api.js';
    import { renderWalletCards, renderExtrato } from '/public/js/v2-financeiro.js';

    await mountShell();
    await renderWalletCards(document.getElementById('cards'));
    await renderExtrato(document.getElementById('extrato'));

    document.getElementById('transfer').onsubmit = async (e) => {
      e.preventDefault();
      const amount = Number(new FormData(e.target).get('amount'));
      try {
        await api('/api/futgreen/transfer-desafio', { method: 'POST', body: { amount } });
        toast('Transferido para Carteira Jornada');
        location.reload();
      } catch (err) {
        toast(err.message);
      }
    };

    document.getElementById('withdraw').onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        await api('/api/futgreen/deduction-withdraw', {
          method: 'POST',
          body: { amount: Number(fd.get('amount')), pix_key: fd.get('pix_key') },
        });
        toast('Solicitação enviada — aguarda aprovação do admin');
        location.reload();
      } catch (err) {
        toast(err.message);
      }
    };

    document.getElementById('deposit').onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        await api('/api/futgreen/deposit-proof', {
          method: 'POST',
          body: { amount: Number(fd.get('amount')), dest: fd.get('dest') },
        });
        toast('Comprovante enviado — aguarde crédito no admin');
        e.target.reset();
      } catch (err) {
        toast(err.message);
      }
    };
  </script>
</body>
</html>
