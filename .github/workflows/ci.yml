name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test & audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify project files
        run: |
          test -f README.md
          test -f package.json
          test -f scripts/futgreen-server.mjs

      - name: Unit tests
        run: npm test

      - name: Audit surface
        run: npm run audit:prod

      - name: Seed + health smoke
        run: |
          npm run seed
          node scripts/futgreen-server.mjs &
          pid=$!
          sleep 1
          curl -sf http://localhost:3101/health | grep -q stake_lock_v1
          kill $pid
          echo "CI OK — FutGreen"
