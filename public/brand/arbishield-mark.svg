<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="ARBISHIELD">
  <defs>
    <linearGradient id="asGlow" x1="18%" y1="8%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#e6ff66"/>
      <stop offset="45%" stop-color="#c8ff00"/>
      <stop offset="100%" stop-color="#3dff9a"/>
    </linearGradient>
    <linearGradient id="asDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121816"/>
      <stop offset="100%" stop-color="#070908"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- app tile -->
  <rect width="128" height="128" rx="28" fill="url(#asDark)"/>
  <rect x="6" y="6" width="116" height="116" rx="24" fill="none" stroke="url(#asGlow)" stroke-opacity="0.35" stroke-width="2"/>
  <!-- shield silhouette -->
  <path filter="url(#soft)" fill="url(#asGlow)" d="M64 18
    C78 18 96 24 104 30
    V62
    C104 86 88 102 64 112
    C40 102 24 86 24 62
    V30
    C32 24 50 18 64 18Z"/>
  <!-- checkmark cut -->
  <path fill="none" stroke="#070908" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" d="M45 64l14 14 24-28"/>
</svg>
