<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/public/brand/favicon.svg" type="image/svg+xml" />
  <title>Usuários · FUTGREEN</title>
  <link rel="stylesheet" href="/public/css/futgreen.css" />
</head>
<body>
  <div class="fg-shell" id="fg-shell-root">
    <main class="fg-main">
      <section class="fg-section">
        <h2>Usuários</h2>
        <div id="list"></div>
      </section>
    </main>
  </div>
  <script type="module">
    import { mountShell } from '/public/js/v2-shell.js';
    import { api, toast, brl, setImpersonate } from '/public/js/api.js';
    import { BUCKET_LABELS } from '/public/js/v2-financeiro.js';
    await mountShell({ admin: true });

    function statusHtml(u) {
      if (u.is_blocked) return '<span class="fg-status lost">Bloqueada</span>';
      if (u.is_active !== false) return '<span class="fg-status active">Ativa</span>';
      if (u.deposit_only) return '<span class="fg-status pending">Aguardando depósito</span>';
      return '<span class="fg-status pending">Pendente</span>';
    }

    async function load() {
      const { users } = await api('/api/futgreen/users', { admin: true });
      const el = document.getElementById('list');
      const sorted = [...users].sort(
        (a, b) =>
          Number(!a.is_blocked) - Number(!b.is_blocked) ||
          Number(a.is_active) - Number(b.is_active) ||
          String(a.email).localeCompare(b.email),
      );

      if (!sorted.length) {
        el.innerHTML = '<p class="fg-empty">Nenhum usuário.</p>';
        return;
      }

      el.innerHTML = sorted
        .map((u) => {
          const active = u.is_active !== false;
          const blocked = Boolean(u.is_blocked);
          const activateBtn = active
            ? `<button class="fg-btn ghost" type="button" data-active="0">Desativar</button>`
            : `<button class="fg-btn" type="button" data-active="1">Ativar conta</button>`;
          const blockBtn = blocked
            ? `<button class="fg-btn" type="button" data-block="0">Desbloquear</button>`
            : `<button class="fg-btn ghost" type="button" data-block="1">Bloquear</button>`;
          return `
      <article class="mdz-card${active ? '' : ' is-pending'}${blocked ? ' is-blocked' : ''}" data-id="${u.id}" data-email="${u.email}" data-name="${String(u.name || '').replace(/"/g, '&quot;')}">
        <div class="mdz-card-top">
          <span>${u.name} · ${u.email}</span>
          <span>${u.role} · ${statusHtml(u)}</span>
        </div>
        <div class="fg-meta">
          Apostador ${brl(u.wallet?.balance_cents)} ·
          Reembolso ${brl(u.wallet?.deduction_balance_cents)} ·
          Jornada ${brl(u.wallet?.desafio_balance_cents)}
        </div>
        <div class="fg-meta">
          Link: <code>${u.referral_code || '—'}</code>
          · Indicados: ${u.referrals_count || 0}
          ${u.referred_by_name ? ` · Veio de: ${u.referred_by_name}` : ''}
        </div>
        <form class="fg-form adj" style="grid-template-columns:1fr 1fr 1fr auto;display:grid;gap:.5rem;align-items:end">
          <label>Bucket
            <select name="bucket">
              ${Object.entries(BUCKET_LABELS)
                .map(([k, v]) => `<option value="${k}">${v}</option>`)
                .join('')}
            </select>
          </label>
          <label>Delta (R$) <input name="delta" type="number" step="0.01" required /></label>
          <label>Nota <input name="note" type="text" placeholder="ajuste" /></label>
          <button class="fg-btn" type="submit">Ajustar</button>
        </form>
        <div class="mdz-card-foot">
          ${activateBtn}
          ${blockBtn}
          <button class="fg-btn ghost" type="button" data-mirror>Espelho de conta</button>
          <button class="fg-btn danger" type="button" data-delete>Excluir</button>
        </div>
      </article>`;
        })
        .join('');

      el.querySelectorAll('.adj').forEach((form) => {
        form.onsubmit = async (e) => {
          e.preventDefault();
          const card = form.closest('.mdz-card');
          const fd = new FormData(form);
          try {
            await api('/api/futgreen/adjust-balance', {
              method: 'POST',
              admin: true,
              body: {
                user_id: card.dataset.id,
                bucket: fd.get('bucket'),
                delta: Number(fd.get('delta')),
                note: fd.get('note'),
              },
            });
            toast('Saldo ajustado');
            await load();
          } catch (err) {
            toast(err.message);
          }
        };
      });

      el.querySelectorAll('[data-active]').forEach((btn) => {
        btn.onclick = async () => {
          const card = btn.closest('.mdz-card');
          const next = btn.dataset.active === '1';
          try {
            await api('/api/futgreen/users/set-active', {
              method: 'POST',
              admin: true,
              body: { user_id: card.dataset.id, is_active: next },
            });
            toast(next ? 'Conta ativada' : 'Conta desativada');
            await load();
          } catch (err) {
            toast(err.message);
          }
        };
      });

      el.querySelectorAll('[data-block]').forEach((btn) => {
        btn.onclick = async () => {
          const card = btn.closest('.mdz-card');
          const next = btn.dataset.block === '1';
          const label = card.dataset.name || card.dataset.email;
          if (next && !confirm(`Bloquear ${label}? A pessoa não poderá entrar nem usar a app.`)) return;
          try {
            await api('/api/futgreen/users/set-blocked', {
              method: 'POST',
              admin: true,
              body: { user_id: card.dataset.id, is_blocked: next },
            });
            toast(next ? 'Usuário bloqueado' : 'Usuário desbloqueado');
            await load();
          } catch (err) {
            toast(err.message);
          }
        };
      });

      el.querySelectorAll('[data-delete]').forEach((btn) => {
        btn.onclick = async () => {
          const card = btn.closest('.mdz-card');
          const label = card.dataset.name || card.dataset.email;
          if (!confirm(`Excluir permanentemente ${label}? Esta ação não pode ser desfeita.`)) return;
          if (!confirm(`Confirma exclusão de ${card.dataset.email}?`)) return;
          try {
            await api('/api/futgreen/users/delete', {
              method: 'POST',
              admin: true,
              body: { user_id: card.dataset.id },
            });
            toast('Usuário excluído');
            await load();
          } catch (err) {
            toast(err.message);
          }
        };
      });

      el.querySelectorAll('[data-mirror]').forEach((btn) => {
        btn.onclick = () => {
          setImpersonate(btn.closest('.mdz-card').dataset.email);
          location.href = '/app.html';
        };
      });
    }

    await load();
  </script>
</body>
</html>
