<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visão Geral · ARBISHIELD</title>
  <link rel="icon" href="/public/brand/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/public/brand/apple-touch-icon.png" />
  <link rel="stylesheet" href="/public/css/futgreen.css" />
</head>
<body>
  <div class="fg-shell" id="fg-shell-root">
    <main class="fg-main">
      <h1 class="fg-page-title">Visão Geral</h1>

      <section class="fg-event-rail" id="event-rail" aria-label="Eventos">
        <div class="fg-event-rail-head">
          <h2 id="event-rail-title">Eventos disponíveis</h2>
          <div class="fg-event-rail-nav">
            <button type="button" data-rail="prev" aria-label="Anterior">‹</button>
            <button type="button" data-rail="next" aria-label="Próximo">›</button>
          </div>
        </div>
        <div class="fg-event-rail-track" id="event-rail-track" tabindex="0"></div>
      </section>

      <div class="fg-dash-bottom">
        <article class="fg-card fg-news-card">
          <div class="fg-news-head">
            <h3 style="margin:0;font-family:var(--font-display);font-style:italic;text-transform:uppercase;font-size:1.05rem">Notícias do futebol</h3>
            <span class="fg-meta" style="margin:0">via FotMob</span>
          </div>
          <div id="news-list" class="fg-news-list">
            <div class="fg-news-empty fg-meta">Carregando notícias…</div>
          </div>
        </article>

        <article class="fg-card">
          <h3 style="margin:0 0 0.6rem;font-family:var(--font-display);font-style:italic;text-transform:uppercase;font-size:1.05rem">Resumo operacional</h3>
          <div class="fg-ops-list" id="ops">
            <div class="fg-ops-row">
              <div style="flex:1">
                <span>Taxa de acerto</span>
                <div class="fg-bar"><i id="win-bar" style="width:0%"></i></div>
              </div>
              <strong id="win-rate">—</strong>
            </div>
            <div class="fg-ops-row"><span>Proteções ativas</span><strong id="k-prot">0</strong></div>
            <div class="fg-ops-row"><span>Proteções liquidas</span><strong id="op-settled">0</strong></div>
            <div class="fg-ops-row"><span>Reembolsos</span><strong id="op-reemb">0</strong></div>
            <div class="fg-ops-row"><span>Saldo Provedor</span><strong id="op-prov">—</strong></div>
          </div>
        </article>
      </div>

    </main>
  </div>
  <script type="module">
    import { mountShell } from '/public/js/v2-shell.js';
    import { api, brl, fmtWhen } from '/public/js/api.js';

    const STADIUM = '/public/assets/hero-stadium.jpg';
    const TEAM_PREFIX = /^(fc|ac|sc|st|cf|cd|afc|as|ss|sv|rc|rcd|ud|sd|bk|fk|sk|nk|vk)$/i;

    const me = await mountShell();
    const w = me.wallet || {};

    document.getElementById('op-prov').textContent = brl(w.investor_balance_cents);

    const patrimonio =
      (w.balance_cents || 0) +
      (w.deduction_balance_cents || 0) +
      (w.desafio_balance_cents || 0) +
      (w.investor_balance_cents || 0);

    let protections = [];
    try {
      const data = await api('/api/futgreen/protections');
      protections = data.protections || [];
    } catch { /* ignore */ }

    const active = protections.filter((p) => p.status === 'active').length;
    const settled = protections.filter((p) => String(p.status).startsWith('settled')).length;
    const reemb = protections.filter((p) => p.result === 'reembolso').length;
    const won = protections.filter((p) => p.result === 'ganho' || p.result === 'won').length;
    const decided = protections.filter((p) => p.result).length;
    const rate = decided ? Math.round((won / decided) * 1000) / 10 : 55.6;
    const delta = active || settled ? '+2,40%' : '+0,00%';

    void patrimonio;
    void delta;
    document.getElementById('k-prot').textContent = String(active);
    document.getElementById('op-settled').textContent = String(settled);
    document.getElementById('op-reemb').textContent = String(reemb);
    document.getElementById('win-rate').textContent = `${rate}%`;
    document.getElementById('win-bar').style.width = `${Math.min(100, rate)}%`;

    function timeAgo(iso) {
      if (!iso) return '';
      const ms = Date.now() - new Date(iso).getTime();
      if (!Number.isFinite(ms) || ms < 0) return '';
      const min = Math.floor(ms / 60000);
      if (min < 1) return 'agora';
      if (min < 60) return `há ${min} min`;
      const h = Math.floor(min / 60);
      if (h < 24) return `há ${h}h`;
      const d = Math.floor(h / 24);
      return `há ${d}d`;
    }

    async function loadNews() {
      const host = document.getElementById('news-list');
      try {
        const { items } = await api('/api/futgreen/news?limit=6');
        if (!items || !items.length) {
          host.innerHTML = '<div class="fg-news-empty fg-meta">Sem notícias no momento.</div>';
          return;
        }
        host.innerHTML = items
          .map(
            (n) => `
          <a class="fg-news-item" href="${n.url || '#'}" target="_blank" rel="noopener noreferrer">
            ${n.image_url ? `<span class="fg-news-thumb"><img src="${n.image_url}" alt="" loading="lazy" /></span>` : ''}
            <span class="fg-news-body">
              <strong>${n.title}</strong>
              <span class="fg-news-meta">${n.source || 'FotMob'} · ${timeAgo(n.published_at)}</span>
            </span>
          </a>`,
          )
          .join('');
      } catch {
        host.innerHTML = '<div class="fg-news-empty fg-meta">Não foi possível carregar as notícias.</div>';
      }
    }
    await loadNews();

    function shortTeamName(name) {
      const raw = String(name || '').trim();
      if (!raw) return '—';
      const parts = raw.split(/\s+/).filter(Boolean);
      if (parts.length <= 1) return raw;
      if (TEAM_PREFIX.test(parts[0])) return parts[1] || parts[0];
      return parts[0];
    }

    function kickoffPassed(startsAt, now = Date.now()) {
      const t = new Date(startsAt || 0).getTime();
      return Number.isFinite(t) && t > 0 && now >= t;
    }

    function isAdminLaunch(m) {
      const side = String(m?.side || '').toUpperCase();
      const odd = Number(m?.odd);
      return (side === 'BACK' || side === 'LAY') && Number.isFinite(odd) && odd > 1;
    }

    function cardBg(row) {
      const raw = row?.card_bg || row?.home_art || row?.away_art || '';
      if (!raw || /\/badge\//i.test(raw)) return STADIUM;
      return raw;
    }

    function fmtKickBadge(iso) {
      if (!iso) return '—';
      try {
        const d = new Date(iso);
        const now = new Date();
        const hm = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        if (d.toDateString() === now.toDateString()) return `Hoje ${hm}`;
        const tomorrow = new Date(now);
        tomorrow.setDate(now.getDate() + 1);
        if (d.toDateString() === tomorrow.toDateString()) return `Amanhã ${hm}`;
        return d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
      } catch {
        return fmtWhen(iso);
      }
    }

    function eventKey(m) {
      return [m.home_team, m.away_team, m.starts_at, m.league || ''].join('|');
    }

    function groupProteger(matches) {
      const map = new Map();
      for (const m of matches) {
        const key = eventKey(m);
        if (!map.has(key)) {
          map.set(key, {
            key,
            home_team: m.home_team,
            away_team: m.away_team,
            home_logo: m.home_logo,
            away_logo: m.away_logo,
            starts_at: m.starts_at,
            league: m.league,
            card_bg: m.card_bg || m.home_art || m.away_art,
            match_live: m.match_live,
            match_finished: m.match_finished,
            match_phase: m.match_phase,
            odd: m.odd,
            side: m.side,
            market_name: m.market_name,
            selection_name: m.selection_name,
            count: 0,
          });
        }
        const g = map.get(key);
        g.count += 1;
        if (!g.card_bg && (m.card_bg || m.home_art || m.away_art)) {
          g.card_bg = m.card_bg || m.home_art || m.away_art;
        }
        if (!g.home_logo && m.home_logo) g.home_logo = m.home_logo;
        if (!g.away_logo && m.away_logo) g.away_logo = m.away_logo;
        if (m.match_live) g.match_live = true;
        if (m.match_finished) g.match_finished = true;
      }
      return [...map.values()];
    }

    function cardHtml(ev) {
      const kindClass = ev.past ? 'is-past' : ev.kind === 'jornada' ? 'is-jornada' : '';
      const when = ev.past
        ? 'Encerrado'
        : ev.live
          ? 'Ao vivo'
          : fmtKickBadge(ev.starts_at);
      const meta = ev.meta || '';
      const cta = ev.past ? 'Ver histórico →' : ev.kind === 'jornada' ? 'Abrir Desafio →' : 'Proteger →';
      const home = shortTeamName(ev.home_team);
      const away = shortTeamName(ev.away_team);
      return `
        <a class="fg-event-card" href="${ev.href}">
          <div class="fg-event-card-bg" aria-hidden="true">
            <img src="${cardBg(ev)}" alt="" loading="lazy" />
          </div>
          <div class="fg-event-card-veil" aria-hidden="true"></div>
          <div class="fg-event-card-body">
            <div class="fg-event-card-top">
              <span class="fg-event-kind ${kindClass}">${ev.kindLabel}</span>
              <span class="fg-event-when">${when}</span>
            </div>
            <div class="fg-event-teams">
              ${ev.home_logo ? `<img src="${ev.home_logo}" alt="" />` : ''}
              <strong title="${ev.home_team}">${home}</strong>
              <span class="fg-event-vs">×</span>
              ${ev.away_logo ? `<img src="${ev.away_logo}" alt="" />` : ''}
              <strong title="${ev.away_team}">${away}</strong>
            </div>
            ${meta ? `<p class="fg-event-meta">${meta}</p>` : ''}
            <span class="fg-event-cta">${cta}</span>
          </div>
        </a>`;
    }

    function mountRail(cards, { title, mode }) {
      const titleEl = document.getElementById('event-rail-title');
      const track = document.getElementById('event-rail-track');
      titleEl.textContent = title;
      track.dataset.mode = mode;
      if (!cards.length) {
        track.innerHTML = '<div class="fg-event-rail-empty">Nenhum evento para exibir agora.</div>';
        return;
      }
      track.innerHTML = cards.map(cardHtml).join('');

      const step = () => {
        const card = track.querySelector('.fg-event-card');
        return card ? card.getBoundingClientRect().width + 14 : 320;
      };
      document.querySelector('[data-rail="prev"]').onclick = () => {
        track.scrollBy({ left: -step(), behavior: 'smooth' });
      };
      document.querySelector('[data-rail="next"]').onclick = () => {
        track.scrollBy({ left: step(), behavior: 'smooth' });
      };

      let timer = null;
      const play = () => {
        stop();
        if (cards.length < 2) return;
        timer = setInterval(() => {
          const maxScroll = track.scrollWidth - track.clientWidth - 4;
          if (track.scrollLeft >= maxScroll) {
            track.scrollTo({ left: 0, behavior: 'smooth' });
          } else {
            track.scrollBy({ left: step(), behavior: 'smooth' });
          }
        }, 4200);
      };
      const stop = () => {
        if (timer) clearInterval(timer);
        timer = null;
      };
      track.addEventListener('pointerenter', stop);
      track.addEventListener('pointerleave', play);
      track.addEventListener('touchstart', stop, { passive: true });
      play();
    }

    async function loadEventRail() {
      const [matchData, desafioData] = await Promise.all([
        api('/api/futgreen/matches').catch(() => ({ matches: [], finished: [] })),
        api('/api/futgreen/desafios?preview=1').catch(() => ({ desafios: [] })),
      ]);

      const now = Date.now();
      const availableMatches = (matchData.matches || []).filter(isAdminLaunch);
      const finishedMatches = (matchData.finished || []).filter(isAdminLaunch);

      // Mesma fila da página Proteger (inclui ao vivo; só some quando encerrado)
      const protegerOpen = groupProteger(availableMatches)
        .filter((ev) => !ev.match_finished && ev.match_phase !== 'finished')
        .map((ev) => {
          const live = Boolean(ev.match_live) || kickoffPassed(ev.starts_at);
          return {
            kind: 'proteger',
            kindLabel: 'Proteger',
            href: '/app-proteger.html',
            home_team: ev.home_team,
            away_team: ev.away_team,
            home_logo: ev.home_logo,
            away_logo: ev.away_logo,
            starts_at: ev.starts_at,
            card_bg: ev.card_bg,
            live,
            past: false,
            meta: [
              ev.league,
              ev.side && ev.odd ? `${String(ev.side).toUpperCase()} ${Number(ev.odd).toFixed(2)}` : null,
              ev.count > 1 ? `${ev.count} mercados` : null,
            ]
              .filter(Boolean)
              .join(' · '),
          };
        });

      const jornadaOpen = (desafioData.desafios || [])
        .filter(({ desafio }) => desafio && !/seed/i.test(String(desafio.title || '')))
        .flatMap(({ desafio, steps }) =>
          (steps || [])
            .filter((s) => s.status !== 'done')
            .map((step) => {
              const live = kickoffPassed(step.starts_at, now);
              const team =
                step.bet_team_side === 'away' ? step.away_team : step.home_team;
              return {
                kind: 'jornada',
                kindLabel: 'Desafio',
                href: '/app-desafio.html',
                home_team: step.home_team,
                away_team: step.away_team,
                home_logo: step.home_logo,
                away_logo: step.away_logo,
                starts_at: step.starts_at,
                card_bg: step.card_bg || step.home_art || step.away_art,
                live,
                past: false,
                meta: [
                  team ? `Zebra ${shortTeamName(team)}` : null,
                  step.odd_futgreen ? `Odd ${Number(step.odd_futgreen).toFixed(2)}` : null,
                ]
                  .filter(Boolean)
                  .join(' · '),
              };
            }),
        );

      const available = [...protegerOpen, ...jornadaOpen].sort(
        (a, b) => new Date(a.starts_at || 0) - new Date(b.starts_at || 0),
      );

      if (available.length) {
        mountRail(available, { title: 'Eventos disponíveis', mode: 'open' });
        return;
      }

      const recentProteger = groupProteger(finishedMatches)
        .sort((a, b) => new Date(b.starts_at || 0) - new Date(a.starts_at || 0))
        .slice(0, 8)
        .map((ev) => ({
          kind: 'proteger',
          kindLabel: 'Proteger',
          href: '/app-proteger.html',
          home_team: ev.home_team,
          away_team: ev.away_team,
          home_logo: ev.home_logo,
          away_logo: ev.away_logo,
          starts_at: ev.starts_at,
          card_bg: ev.card_bg,
          live: false,
          past: true,
          meta: [ev.league, fmtWhen(ev.starts_at)].filter(Boolean).join(' · '),
        }));

      const recentJornada = (desafioData.desafios || [])
        .flatMap(({ desafio, steps }) =>
          (steps || [])
            .filter((s) => s.status === 'done' || kickoffPassed(s.starts_at, now))
            .map((step) => ({
              kind: 'jornada',
              kindLabel: 'Desafio',
              href: '/app-desafio.html',
              home_team: step.home_team,
              away_team: step.away_team,
              home_logo: step.home_logo,
              away_logo: step.away_logo,
              starts_at: step.starts_at,
              card_bg: step.card_bg || step.home_art || step.away_art,
              live: false,
              past: true,
              meta: [desafio?.title, fmtWhen(step.starts_at)].filter(Boolean).join(' · '),
            })),
        )
        .sort((a, b) => new Date(b.starts_at || 0) - new Date(a.starts_at || 0))
        .slice(0, 8);

      const recent = [...recentProteger, ...recentJornada]
        .sort((a, b) => new Date(b.starts_at || 0) - new Date(a.starts_at || 0))
        .slice(0, 12);

      mountRail(recent, { title: 'Últimos eventos', mode: 'recent' });
    }

    await loadEventRail();
  </script>
</body>
</html>
